<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Scan QR Code') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <div class="top-nav">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="logo" onclick="window.location.href='{{ url_for('admin_dashboard') }}'">
            Admin<span>Panel</span>
        </div>
        <div class="user-info">
            <a href="{{ url_for('toggle_language') }}" class="lang-switch">
                <span class="lang-option {% if lang == 'en' %}lang-active{% else %}lang-inactive{% endif %}">EN</span>
                <span class="lang-option {% if lang == 'id' %}lang-active{% else %}lang-inactive{% endif %}">ID</span>
            </a>
            <span>{{ _('Admin') }}: {{ session.username }}</span>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <ul class="top-menu">
            <li><a href="{{ url_for('admin_dashboard') }}">📊 {{ _('Dashboard') }}</a></li>
            <li><a href="{{ url_for('admin_scan_qr') }}">📷 {{ _('Scan QR') }}</a></li>
            <li><a href="{{ url_for('admin_profile') }}">👤 {{ _('Profile') }}</a></li>
        </ul>
        <ul class="bottom-menu">
            <li><a href="{{ url_for('admin_logout') }}">🚪 {{ _('Logout') }}</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <div class="card">
            <h3>📷 {{ _('Scan QR Code') }}</h3>
            <p>{{ _('Upload an image containing the QR code, or use your camera.') }}</p>
            <input type="file" id="qrImageInput" accept="image/*" style="margin: 15px 0;">
            <br>
            <button id="startCameraBtn">📹 {{ _('Start Camera') }}</button>
            <video id="video" width="300" autoplay style="display:none; margin-top: 15px; border-radius: 8px;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <div id="result" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        // Camera and QR scanning (page‑specific)
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let scanning = false;
        let stream = null;

        document.getElementById('qrImageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, img.width, img.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    const url = code.data;
                    const match = url.match(/\/admin\/return\/([^?#]+)/);
                    if (match && match[1]) {
                        window.location.href = "{{ url_for('admin_return_session', token='') }}" + match[1];
                    } else {
                        document.getElementById('result').innerHTML = '<span style="color:red;">{{ _('Invalid QR code (no valid return URL).') }}</span>';
                    }
                } else {
                    document.getElementById('result').innerHTML = '<span style="color:red;">{{ _('No QR code found in image.') }}</span>';
                }
            };
            img.src = URL.createObjectURL(file);
        });

        document.getElementById('startCameraBtn').addEventListener('click', async () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                scanning = false;
                document.getElementById('startCameraBtn').textContent = '📹 {{ _('Start Camera') }}';
                stream = null;
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.style.display = 'block';
                video.play();
                scanning = true;
                document.getElementById('startCameraBtn').textContent = '⏹️ {{ _('Stop Camera') }}';
                requestAnimationFrame(scan);
            } catch (err) {
                document.getElementById('result').innerHTML = '<span style="color:red;">{{ _('Camera access denied or not available.') }}</span>';
            }
        });

        function scan() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                if (code) {
                    const url = code.data;
                    const match = url.match(/\/admin\/return\/([^?#]+)/);
                    if (match && match[1]) {
                        scanning = false;
                        if (stream) {
                            stream.getTracks().forEach(track => track.stop());
                            stream = null;
                        }
                        video.style.display = 'none';
                        document.getElementById('startCameraBtn').textContent = '📹 {{ _('Start Camera') }}';
                        window.location.href = "{{ url_for('admin_return_session', token='') }}" + match[1];
                        return;
                    } else {
                        document.getElementById('result').innerHTML = '<span style="color:red;">{{ _('Invalid QR code (not a return URL).') }}</span>';
                    }
                } else {
                    document.getElementById('result').innerHTML = '';
                }
            }
            requestAnimationFrame(scan);
        }
    </script>
</body>
</html>
